name: AQI Backfill (manual)

on:
  workflow_dispatch: {}

concurrency:
  group: aqi-pipeline-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run backfill
        env:
          AQI_API_KEY: ${{ secrets.AQI_API_KEY }}
        run: python -m scripts.extract.backfill
      - name: Rebuild clean CSV
        run: python scripts/transform/build_clean.py
      - name: Commit and push
        run: |
          git config user.name "aqi-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            git add data/raw data/clean
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "data: backfill run $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            if git push origin main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected, pulling latest and retrying ($i)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 10 + 5))
          done

          echo "Push failed after 5 attempts."
          exit 1